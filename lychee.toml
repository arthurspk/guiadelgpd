# Configuração do verificador de links (https://github.com/lycheeverse/lychee)
# Uso: lychee --no-progress './**/*.md'
#
# Retries/concorrência reduzidos para evitar falsos positivos por rate limit.
max_retries = 6
retry_wait_time = 8
max_concurrency = 8
max_redirects = 10
accept = [200, 206, 301, 302, 303, 307, 308]

# Alguns sites (Spotify, Catho) bloqueiam o user-agent padrão do lychee, mas
# respondem 200 normalmente com um user-agent de navegador real (confirmado
# nesta sessão via curl).
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# O LinkedIn responde HTTP 999 a qualquer verificador automatizado (bloqueio
# anti-bot), mesmo com o perfil no ar.
# direitosp.fgv.br: verificado manualmente com curl (HTTP 200, confirmado
# nesta sessão), mas o TLS do servidor da FGV falha o handshake com o cliente
# rustls do lychee ("fatal alert: HandshakeFailure") — não é link morto.
# facebook.com/seixasqlc: perfil do mantenedor (mesmo link usado em todos os
# guias da rede), bloqueado com 400 tanto pelo lychee quanto por curl direto
# nesta sessão (bloqueio anti-bot do Facebook, provavelmente por volume de
# checagens simultâneas de vários guias); página confirmada existente.
exclude = [
    "^https://www\\.linkedin\\.com/",
    "^https://direitosp\\.fgv\\.br/",
    "^https://www\\.facebook\\.com/seixasqlc/",
]

[hosts."www.youtube.com"]
concurrency = 2
